name: coaching-class-manager
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-dev.ps1 first}
      POSTGRES_DB: coaching
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - coaching-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  coaching-db:
