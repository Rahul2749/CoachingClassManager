name: coaching-class-manager-staging
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coaching
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: coaching
    volumes:
      - staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coaching -d coaching"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: api/CoachingClassManager.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      Auth__EnableDevelopmentOtp: "false"
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?Required}
      Auth__OtpPepper: ${OTP_PEPPER:?Required}
      ConnectionStrings__Database: Host=db;Database=coaching;Username=coaching;Password=${POSTGRES_PASSWORD}
      AllowedHosts: ${ALLOWED_HOSTS:?Required}
      ReverseProxy__KnownProxies__0: ${TRUSTED_PROXY_IP:?Set the address of the reverse proxy as seen by the API container}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5081:8080"
volumes:
  staging-db:
